name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: a selftest that writes temp
        # directories named after its own test cases has already been broken
        # once by a ':' that is legal on POSIX and illegal on Windows.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history -- memory verify_commits() checks real commit SHAs, which a shallow clone would not contain
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"

      - name: unit tests
        run: python -m pytest -q

      - name: coverage (reported, not gated -- no threshold has been earned yet)
        # A coverage number with a claimed target attached before the target
        # has been reached is exactly the kind of invented claim this project
        # exists to refuse. This reports the real figure every run; it does
        # not fail the build on it. See ROADMAP.md.
        run: python -m pytest --cov=orchestrate_kit --cov-report=term-missing -q

      - name: example plugin (proves the plugin system generalizes)
        run: python -m pytest examples/python-quality-plugin -q

      - name: each test file must pass IN ISOLATION
        shell: bash
        # Not redundant with the suite. A suite can pass purely by import
        # order -- one file doing a sys.path insert that every later file
        # silently depends on. Running each file alone is the only way to see
        # it, and renaming one file is enough to break the whole suite.
        run: |
          for f in tests/test_*.py; do
            echo "--- $f"
            python -m pytest "$f" -q || exit 1
          done

      - name: negative control -- prove the evaluator can fail
        # A green evaluator means nothing unless it is capable of red. This
        # injects ten defect classes and requires each to be caught, plus
        # three benign cases that must stay quiet.
        run: python -m orchestrate_kit selftest

      - name: memory invariants
        shell: bash
        run: |
          python -m orchestrate_kit memory seed
          python -m orchestrate_kit memory list
          python -m orchestrate_kit graph > /dev/null
          python -m orchestrate_kit viz all --out /tmp/diagrams

      - name: memory provenance (files + commits an entry cites must be real)
        # MEMORY_GOVERNANCE.md's quality-gate section names this as a gap:
        # `orchestrate memory verify` existed and worked but wasn't run in
        # CI, so a deleted file or unreachable commit a future entry cites
        # wouldn't be caught automatically. This closes that gap.
        run: python -m orchestrate_kit memory verify

      - name: mentor must not silently degrade to PROCEED-for-everything
        shell: bash
        run: |
          python -m orchestrate_kit mentor "use dense embeddings" && {
            echo "FAIL: a measured rejection did not block (expected exit 2)"; exit 1; }
          echo "ok: measured rejection blocks as expected"

      - name: hermetic -- no credential may be required
        shell: bash
        env:
          GROQ_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: python -m pytest -q

  dogfood:
    # Runs the evaluator, the mentor, and selftest against THIS repository
    # and publishes the real output as a build artifact -- not "we ran our
    # own tool once locally," a result anyone can open from the Actions tab
    # of any push. One leg of the matrix, not all four: this is about
    # publishing the artifact, not re-testing cross-platform behavior (the
    # `test` job above already covers that).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history -- memory verify_commits() checks real commit SHAs, which a shallow clone would not contain
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"

      - name: orchestrate evaluate . (self-audit)
        # Gated, not just reported: if THIS repository stops passing its own
        # evaluator, that is a real regression and the build should fail on
        # it -- publishing dogfood output nobody reads because it's always
        # green-by-construction would be theater, not confidence.
        run: |
          python -m orchestrate_kit memory seed
          python -m orchestrate_kit evaluate . --markdown dogfood-evaluate.md

      - name: orchestrate selftest (negative control)
        run: python -m orchestrate_kit selftest | tee dogfood-selftest.txt

      - name: orchestrate mentor "add OCR" (sample dogfood output)
        # Not gated on a specific verdict -- the point is to publish a real,
        # current example of the mentor's output, not to assert what it
        # should say about a specific proposal.
        run: python -m orchestrate_kit mentor "I want to add OCR" | tee dogfood-mentor-add-ocr.txt

      - name: orchestrate interview (one scripted turn, non-interactive)
        # `interview` is interactive by default (reads from stdin); piping
        # empty answers exercises the full turn -- question, cross-exam,
        # report -- without needing a live terminal, and is a real run of
        # the actual code path, not a mock.
        run: printf '' | python -m orchestrate_kit interview --persona skeptic --difficulty warmup -n 2 | tee dogfood-interview.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dogfood-self-audit
          path: |
            dogfood-evaluate.md
            dogfood-selftest.txt
            dogfood-mentor-add-ocr.txt
            dogfood-interview.txt
