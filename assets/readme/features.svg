<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Four capabilities: skills, evaluator, scorer, submission checker</title>
  <desc id="d">Four feature cards: eight agent skills, an evaluator that proves its own audits can fail, an estimated scorer using the published weights, and a submission checker that builds the submission folder.</desc>
  <rect width="1200" height="560" fill="#07100B"/>
  <text x="60" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#F2FFF6">What you get</text>

  <!-- card: skills -->
  <g transform="translate(60 100)">
    <rect width="510" height="190" rx="20" fill="#0F1C14" stroke="#1F3A29" stroke-width="2"/>
    <circle cx="56" cy="56" r="28" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <path d="M46 56 h20 M56 46 v20" stroke="#00EA64" stroke-width="4" stroke-linecap="round"/>
    <text x="104" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#F2FFF6">Eight agent skills</text>
    <text x="32" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C9D6CC">Phase by phase: build, test and fix,</text>
    <text x="32" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C9D6CC">submit, interview, package and score.</text>
    <text x="32" y="176" font-family="Consolas, monospace" font-size="14" fill="#8FA596">skills/INDEX.md</text>
  </g>
  <!-- card: evaluator -->
  <g transform="translate(630 100)">
    <rect width="510" height="190" rx="20" fill="#0F1C14" stroke="#1F3A29" stroke-width="2"/>
    <circle cx="56" cy="56" r="28" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <path d="M44 56 l8 8 l16 -18" stroke="#00EA64" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#F2FFF6">Evaluator that can fail</text>
    <text x="32" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C9D6CC">Injects known defects and checks that</text>
    <text x="32" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C9D6CC">every audit catches them before you trust it.</text>
    <text x="32" y="176" font-family="Consolas, monospace" font-size="14" fill="#8FA596">orchestrate selftest</text>
  </g>
  <!-- card: scorer -->
  <g transform="translate(60 320)">
    <rect width="510" height="190" rx="20" fill="#0F1C14" stroke="#1F3A29" stroke-width="2"/>
    <circle cx="56" cy="56" r="28" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <rect x="44" y="50" width="6" height="14" fill="#00EA64"/>
    <rect x="54" y="44" width="6" height="20" fill="#00EA64"/>
    <rect x="64" y="38" width="6" height="26" fill="#00EA64"/>
    <text x="104" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#F2FFF6">Estimated scorer</text>
    <text x="32" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C9D6CC">Four signals with the published weights.</text>
    <text x="32" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C9D6CC">Labels every number as measured or estimated.</text>
    <text x="32" y="176" font-family="Consolas, monospace" font-size="14" fill="#8FA596">orchestrate score</text>
  </g>
  <!-- card: checker -->
  <g transform="translate(630 320)">
    <rect width="510" height="190" rx="20" fill="#0F1C14" stroke="#1F3A29" stroke-width="2"/>
    <circle cx="56" cy="56" r="28" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <rect x="42" y="46" width="28" height="22" rx="3" fill="none" stroke="#00EA64" stroke-width="3"/>
    <path d="M48 56 l5 5 l10 -10" stroke="#00EA64" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#F2FFF6">Submission checker</text>
    <text x="32" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C9D6CC">Checks columns, row coverage, allowed</text>
    <text x="32" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C9D6CC">values and secrets, then builds submission/.</text>
    <text x="32" y="176" font-family="Consolas, monospace" font-size="14" fill="#8FA596">package_submission.py</text>
  </g>
</svg>
