<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Workflow from problem statement to submission</title>
  <desc id="d">Five stages: input, orchestrate and build, evaluate and fix, score and submit, and the package output. A fix loop returns to evaluation.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#00EA64"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#07100B"/>
  <text x="60" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#F2FFF6">From problem statement to submission</text>

  <!-- stage 1 -->
  <g transform="translate(60 110)">
    <rect width="190" height="200" rx="18" fill="#0F1C14" stroke="#1F3A29" stroke-width="2"/>
    <circle cx="95" cy="50" r="26" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <text x="95" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#00EA64">1</text>
    <text x="95" y="114" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#F2FFF6">Input</text>
    <text x="95" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">problem statement</text>
    <text x="95" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">+ dataset</text>
  </g>
  <!-- stage 2 -->
  <g transform="translate(290 110)">
    <rect width="190" height="200" rx="18" fill="#0F1C14" stroke="#1F3A29" stroke-width="2"/>
    <circle cx="95" cy="50" r="26" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <text x="95" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#00EA64">2</text>
    <text x="95" y="114" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#F2FFF6">Orchestrate</text>
    <text x="95" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">design, then build</text>
    <text x="95" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">run the pipeline</text>
  </g>
  <!-- stage 3 -->
  <g transform="translate(520 110)">
    <rect width="190" height="200" rx="18" fill="#0F1C14" stroke="#1F3A29" stroke-width="2"/>
    <circle cx="95" cy="50" r="26" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <text x="95" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#00EA64">3</text>
    <text x="95" y="114" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#F2FFF6">Evaluate</text>
    <text x="95" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">audits and tests</text>
    <text x="95" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">wrong rows found</text>
  </g>
  <!-- stage 4 -->
  <g transform="translate(750 110)">
    <rect width="190" height="200" rx="18" fill="#0F1C14" stroke="#1F3A29" stroke-width="2"/>
    <circle cx="95" cy="50" r="26" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <text x="95" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#00EA64">4</text>
    <text x="95" y="114" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#F2FFF6">Fix</text>
    <text x="95" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">one change at a time</text>
    <text x="95" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">diff the whole output</text>
  </g>
  <!-- stage 5 -->
  <g transform="translate(950 110)">
    <rect width="190" height="200" rx="18" fill="#132519" stroke="#00EA64" stroke-width="3"/>
    <circle cx="95" cy="50" r="26" fill="#00EA64"/>
    <text x="95" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#07100B">5</text>
    <text x="95" y="114" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#F2FFF6">Submission</text>
    <text x="95" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">score, check, package</text>
    <text x="95" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8FA596">output.csv + code.zip</text>
  </g>

  <!-- forward arrows -->
  <path d="M252 210 L286 210" stroke="#00EA64" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M482 210 L516 210" stroke="#00EA64" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M712 210 L746 210" stroke="#00EA64" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M942 210 L976 210" stroke="#00EA64" stroke-width="3" marker-end="url(#arr)"/>
  <!-- fix loop: from Fix back to Evaluate -->
  <path d="M845 318 C845 370, 615 370, 615 318" stroke="#00EA64" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="730" y="372" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8FA596">fix, then evaluate again</text>
</svg>
