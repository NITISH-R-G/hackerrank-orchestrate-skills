<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="t d">
  <title id="t">orchestrate-kit: measure before you ship</title>
  <desc id="d">Dark banner with a green node network, the project name, and the tagline Measure before you ship.</desc>
  <defs>
