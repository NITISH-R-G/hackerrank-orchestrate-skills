  <text x="96" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="36" fill="#C9D6CC">Measure before you ship.</text>
  <text x="96" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#8FA596">Agent skills, an evaluator and an estimated scorer</text>
