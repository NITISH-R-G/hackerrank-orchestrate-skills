[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrate-kit"
version = "1.0.0"
description = "Infrastructure for building AI systems you can defend: evaluator, engineering memory, mentor, and an adaptive interview simulator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["evaluation", "ai-engineering", "audit", "interview", "hackerrank"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

# No runtime dependencies, on purpose. Every tool here must run on a plane, in
# a locked-down CI container, and with no API key. A practice tool you cannot
# run offline is a practice tool you do not use.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
orchestrate = "orchestrate_kit.cli:main"

[project.urls]
Homepage = "https://github.com/NITISH-R-G/hackerrank-orchestrate-skills"
Issues = "https://github.com/NITISH-R-G/hackerrank-orchestrate-skills/issues"

[tool.setuptools.packages.find]
include = ["orchestrate_kit*"]

[tool.setuptools.package-data]
orchestrate_kit = ["../data/memory.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
